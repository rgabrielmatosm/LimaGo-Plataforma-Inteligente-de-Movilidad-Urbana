# LimaGo V3 — despliegue con Docker Compose (Docker Desktop en Windows 10/11, macOS o Linux)
#   (opcional) Copy-Item .env.example .env   — sin .env todas las contraseñas son LimaGoPass
#   docker compose up --build -d
#     Sitio web ............ http://localhost:8080
#     Grafana (monitoreo) .. http://localhost:3000   (solo desde este equipo)
#     Prometheus ........... http://localhost:9090   (solo desde este equipo)
name: limago

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-limago}
      POSTGRES_USER: ${POSTGRES_USER:-limago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-LimaGoPass}
    volumes:
      - datos_postgres_v3:/var/lib/postgresql/data   # volumen propio de la V3: evita contraseñas de versiones anteriores
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: limago-backend:3.0
    env_file:
      - path: .env
        required: false   # sin .env se usan los valores por defecto (contraseñas LimaGoPass)
    environment:
      LIMAGO_URL_BASE_DATOS: postgresql+psycopg://${POSTGRES_USER:-limago}:${POSTGRES_PASSWORD:-LimaGoPass}@postgres:5432/${POSTGRES_DB:-limago}
      LIMAGO_SERVIR_FRONTEND: "0"
      LIMAGO_TOKEN_OPERACIONES: ${LIMAGO_TOKEN_OPERACIONES:-LimaGoPass}
      LIMAGO_RUTA_CACHE_GEOCODIFICACION: /app/cache/geocodificacion.json
    mem_limit: 1536m
    volumes:
      - cache_geocodificacion:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna, externa]   # externa: salida a Nominatim para buscar direcciones
    restart: unless-stopped

  worker:
    build:                         # misma imagen que el backend (se reutiliza la caché), otro proceso;
      context: .                   # así Docker nunca intenta descargarla de Docker Hub
      dockerfile: docker/backend.Dockerfile
    image: limago-backend:3.0
    command: ["python", "-m", "api.worker"]
    env_file:
      - path: .env
        required: false   # sin .env se usan los valores por defecto (contraseñas LimaGoPass)
    # V3: la red de Lima Metropolitana (152 mil intersecciones) ocupa ~0,5 GB en memoria en cada proceso.
    mem_limit: 1536m
    environment:
      LIMAGO_URL_BASE_DATOS: postgresql+psycopg://${POSTGRES_USER:-limago}:${POSTGRES_PASSWORD:-LimaGoPass}@postgres:5432/${POSTGRES_DB:-limago}
      LIMAGO_PUERTO_METRICAS_WORKER: "9100"
      LIMAGO_TOKEN_OPERACIONES: ${LIMAGO_TOKEN_OPERACIONES:-LimaGoPass}
    expose: ["9100"]               # métricas para Prometheus (solo red interna)
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started  # garantiza que la imagen ya fue construida
    networks: [interna]
    healthcheck:
      test: ["CMD", "python", "-m", "api.salud_worker"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: limago-frontend:3.0
    ports:
      - "${LIMAGO_PUERTO_WEB:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [interna, externa]
    restart: unless-stopped

  # --- Monitoreo (V2): métricas reales de la API y del worker ---
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - datos_prometheus:/prometheus
    ports:
      - "127.0.0.1:${LIMAGO_PUERTO_PROMETHEUS:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    networks: [interna, externa]   # externa solo para publicar el puerto en localhost
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-LimaGoPass}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/limago.json
      GF_USERS_DEFAULT_LANGUAGE: es-ES
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - datos_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${LIMAGO_PUERTO_GRAFANA:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [interna, externa]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  datos_postgres_v3:
  cache_geocodificacion:
  datos_prometheus:
  datos_grafana:

networks:
  interna:
    internal: true   # PostgreSQL y el worker no tienen salida a Internet
  externa:
