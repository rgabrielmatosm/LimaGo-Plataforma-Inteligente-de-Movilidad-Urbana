# LimaGo V3 — Nginx como servidor estático y proxy de la API.
# No hay CDN configurado: la caché la hacen el navegador (Cache-Control) y Nginx sirve los archivos
# comprimidos. Ver docs/CDN_Y_RENDIMIENTO.md.
map $uri $limago_cache {
    default                                 "no-cache";
    ~*\.html$                               "no-cache";
    ~*^/(css|js)/                           "public, max-age=604800";
    ~*^/(vendor|img)/                       "public, max-age=2592000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;   # también comprime las respuestas JSON de la API (geojson de cobertura y distritos)
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    etag on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # API: Nginx reenvía al backend por la red interna de Docker. Nunca se guarda en caché.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        # Las páginas HTML se revalidan siempre (ETag) y referencian css/js con ?v=3: al publicar
        # una versión nueva basta con cambiar ese número para invalidar la caché del navegador.
        add_header Cache-Control $limago_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        try_files $uri $uri/ =404;
    }
}
