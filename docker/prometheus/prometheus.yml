# Prometheus de LimaGo: recoge métricas reales de la API y del worker.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
