<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis viajes · LimaGo</title>
  <meta name="description" content="Historial de solicitudes de viaje en LimaGo.">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/estilos.css?v=3">
  <script src="js/plantilla.js?v=3"></script>
</head>
<body data-pagina="historial">
<div data-cabecera></div>

<main id="contenido">
  <header class="encabezado-pagina">
    <div class="contenedor">
      <nav class="migas" aria-label="Ruta"><a href="index.html">Inicio</a> › Mis viajes</nav>
      <h1>Mis viajes</h1>
      <p>Cada solicitud con sus distritos, el conductor que aceptó, la tarifa confirmada y el resultado.</p>
    </div>
  </header>

  <section class="seccion" style="padding-top:20px">
    <div class="contenedor">
      <div class="barra-filtros" role="search">
        <div class="campo">
          <label for="filtro-estado">Estado</label>
          <select class="entrada" id="filtro-estado">
            <option value="">Todos</option>
            <option value="buscando,asignada,esperando_recogida,en_viaje">Activos</option>
            <option value="completada">Completados</option>
            <option value="cancelada">Cancelados</option>
            <option value="rechazada,sin_conductores,sin_ruta,sin_aceptacion,interrumpida">No atendidos</option>
          </select>
        </div>
        <div class="campo" style="flex:1;min-width:220px">
          <label for="filtro-texto">Buscar por lugar o número</label>
          <input class="entrada" id="filtro-texto" type="search" placeholder="Ej.: Larcomar o 128">
        </div>
        <div class="campo">
          <span class="etiqueta-campo" id="etiqueta-origen">Mostrar</span>
          <div class="chips" role="group" aria-labelledby="etiqueta-origen">
            <button class="chip" type="button" data-canal="app" aria-pressed="true">Mis solicitudes</button>
            <button class="chip" type="button" data-canal="todos" aria-pressed="false">Toda la actividad</button>
          </div>
        </div>
        <div class="campo">
          <span class="etiqueta-campo" id="etiqueta-vista">Vista</span>
          <div class="chips" role="group" aria-labelledby="etiqueta-vista">
            <button class="chip" type="button" data-vista="tarjetas" aria-pressed="true">Tarjetas</button>
            <button class="chip" type="button" data-vista="tabla" aria-pressed="false">Tabla</button>
          </div>
        </div>
      </div>

      <p class="ayuda" id="resumen" aria-live="polite"></p>
      <div id="tarjetas" class="tarjetas-viaje"></div>
      <div id="tabla" class="tabla-envoltura oculto">
        <table>
          <caption class="sr">Historial de solicitudes</caption>
          <thead><tr><th scope="col">N.º</th><th scope="col">Fecha</th><th scope="col">Recojo</th><th scope="col">Destino</th><th scope="col">Conductor</th><th scope="col">Llegada</th><th scope="col">Tarifa</th><th scope="col">Estado</th><th scope="col"><span class="sr">Acciones</span></th></tr></thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
      <div id="estado-vacio" class="oculto"></div>
      <div style="text-align:center;margin-top:20px"><button class="boton secundario oculto" id="mas" type="button">Cargar más</button></div>
    </div>
  </section>
</main>

<div data-pie></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/comun.js?v=3"></script>
<script src="js/historial.js?v=3"></script>
</body>
</html>
